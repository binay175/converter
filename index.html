<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1220" />
  <title>Quick Converters</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #1a1f33;
      --card-hover: #212745;
      --input-bg: #10131f;
      --border: #2c3352;
      --border-focus: #5b8def;
      --text: #e8ebf5;
      --text-dim: #8a92b2;
      --accent: #5b8def;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 48px;
      line-height: 1.5;
    }

    .wrap { max-width: 560px; margin: 0 auto; }

    header { text-align: center; margin: 8px 0 28px; }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px 20px;
      margin-bottom: 16px;
      transition: background 0.15s ease;
    }

    .card:focus-within { background: var(--card-hover); }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .card-title .icon { font-size: 1.05rem; }

    .row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 10px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      font-weight: 600;
    }

    .field input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1.05rem;
      padding: 12px 12px;
      outline: none;
      transition: border-color 0.15s ease;
      -moz-appearance: textfield;
    }

    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }

    .field input:focus { border-color: var(--border-focus); }

    .field input::placeholder { color: #4b5375; }

    .swap {
      color: var(--text-dim);
      font-size: 1.1rem;
      padding-bottom: 12px;
      user-select: none;
    }

    /* Formula hint: "1 pound = 0.4536 kilogram" — shown only for the active card */
    .hint {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--accent);
      background: rgba(91, 141, 239, 0.10);
      border: 1px solid rgba(91, 141, 239, 0.28);
      border-radius: 10px;
      padding: 8px 12px;
      display: none;
    }

    .card.active .hint { display: block; }

    .link-card { display: block; text-decoration: none; }
    .link-card .card-title { margin-bottom: 0; color: var(--accent); }
    .link-card:hover, .link-card:focus { background: var(--card-hover); }

    footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.78rem;
      margin-top: 24px;
    }

    @media (max-width: 420px) {
      .row { gap: 8px; }
      .field input { font-size: 1rem; padding: 11px 10px; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Quick Converters</h1>
      <p>Type in either box — the other updates instantly.</p>
    </header>

    <div id="converters"></div>

    <a class="card link-card" href="gold.html">
      <span class="card-title"><span class="icon">🪙</span>Troy Ounce · Gram · USD/INR prices →</span>
    </a>

    <footer>
      Bidirectional conversions · works offline<br />
      &copy; 2026 BinayB. All rights reserved.
    </footer>
  </div>

  <script>
    // Each converter defines a label pair and either:
    //   - `factor`: left = right * factor  (right = left / factor), or
    //   - explicit `toRight`/`toLeft` functions (for non-linear scales like temperature).
    // `leftUnit` / `rightUnit` are the singular unit names used in the "1 unit = ..." hint.
    const CONVERTERS = [
      {
        title: "Fahrenheit ↔ Celsius", icon: "🌡️",
        left: "Fahrenheit", right: "Celsius",
        leftUnit: "Fahrenheit", rightUnit: "Celsius",
        toRight: (f) => (f - 32) * 5 / 9, // left (°F) -> right (°C)
        toLeft:  (c) => c * 9 / 5 + 32    // right (°C) -> left (°F)
      },
      {
        title: "Pound ↔ Kilogram", icon: "⚖️",
        left: "Pounds", right: "Kilograms",
        leftUnit: "pound", rightUnit: "kilogram",
        factor: 2.2046226218 // left(lb) = right(kg) * 2.2046226218
      },
      {
        title: "Number ↔ Million", icon: "🔢",
        left: "Number", right: "Million(s)",
        leftUnit: "number", rightUnit: "million",
        factor: 1000000
      },
      {
        title: "Mile ↔ Kilometer", icon: "🛣️",
        left: "Miles", right: "Kilometers",
        leftUnit: "mile", rightUnit: "kilometer",
        factor: 1 / 1.609344
      },
      {
        title: "Inch ↔ Feet", icon: "📏",
        left: "Inches", right: "Feet",
        leftUnit: "inch", rightUnit: "foot",
        factor: 12
      },
      {
        title: "Centimeter ↔ Inch", icon: "📐",
        left: "Centimeters", right: "Inches",
        leftUnit: "centimeter", rightUnit: "inch",
        factor: 2.54
      }
    ];

    // Format a number cleanly: trim trailing zeros, avoid ugly float noise.
    function fmt(n) {
      if (!isFinite(n)) return "";
      if (n === 0) return "0";
      const abs = Math.abs(n);
      let out;
      if (abs !== 0 && (abs < 1e-6 || abs >= 1e15)) {
        out = n.toExponential(6);
      } else {
        out = parseFloat(n.toFixed(8)).toString();
      }
      return out;
    }

    // Shorter formatting for the "1 unit = ..." hint (keeps it readable).
    function fmtHint(n) {
      if (!isFinite(n)) return "";
      if (n === 0) return "0";
      const abs = Math.abs(n);
      if (abs !== 0 && (abs < 1e-4 || abs >= 1e9)) return n.toExponential(4);
      return parseFloat(n.toFixed(4)).toString();
    }

    const container = document.getElementById("converters");
    const cards = [];

    // Hide the hint on every card except the one passed in.
    function activate(activeCard) {
      cards.forEach((el) => { if (el !== activeCard) el.classList.remove("active"); });
      activeCard.classList.add("active");
    }

    CONVERTERS.forEach((c, idx) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-title"><span class="icon">${c.icon}</span>${c.title}</div>
        <div class="row">
          <div class="field">
            <label for="l${idx}">${c.left}</label>
            <input id="l${idx}" type="number" inputmode="decimal" placeholder="0" autocomplete="off" />
          </div>
          <div class="swap">⇌</div>
          <div class="field">
            <label for="r${idx}">${c.right}</label>
            <input id="r${idx}" type="number" inputmode="decimal" placeholder="0" autocomplete="off" />
          </div>
        </div>
        <div class="hint" id="h${idx}"></div>
      `;
      container.appendChild(card);
      cards.push(card);

      const left = card.querySelector(`#l${idx}`);
      const right = card.querySelector(`#r${idx}`);
      const hint = card.querySelector(`#h${idx}`);

      const toRight = c.toRight || ((v) => v / c.factor);
      const toLeft  = c.toLeft  || ((v) => v * c.factor);

      // Build the "1 <unit> = <value> <unit>" line for whichever direction is active.
      function hintFor(direction) {
        if (direction === "left") {
          return `1 ${c.leftUnit} = ${fmtHint(toRight(1))} ${c.rightUnit}`;
        }
        return `1 ${c.rightUnit} = ${fmtHint(toLeft(1))} ${c.leftUnit}`;
      }

      left.addEventListener("input", () => {
        if (left.value === "") { right.value = ""; card.classList.remove("active"); return; }
        const v = parseFloat(left.value);
        right.value = isNaN(v) ? "" : fmt(toRight(v));
        hint.textContent = hintFor("left");
        activate(card);
      });

      right.addEventListener("input", () => {
        if (right.value === "") { left.value = ""; card.classList.remove("active"); return; }
        const v = parseFloat(right.value);
        left.value = isNaN(v) ? "" : fmt(toLeft(v));
        hint.textContent = hintFor("right");
        activate(card);
      });
    });
  </script>
</body>
</html>
